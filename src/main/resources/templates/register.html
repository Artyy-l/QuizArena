<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - QuizArena</title>
    <style>html, body { background-color: #090719; }</style>
    <link rel="preload" as="image" href="/images/space_for_game.png" fetchpriority="high">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/latex.css">
    <script src="/js/latex-render.js"></script>
<script defer src="/webjars/mathjax/3.2.2/es5/tex-mml-chtml.js"></script>
</head>
<body>
<main class="auth-box">
    <div class="auth-heading">
        <div class="auth-icon"><i data-lucide="user-round-plus" aria-hidden="true"></i></div>
        <h1>Регистрация</h1>
        <p>Создайте профиль и присоединяйтесь к QuizArena.</p>
    </div>
    <form id="registerForm">
        <div class="form-group">
            <label for="username"><i data-lucide="user-round" aria-hidden="true"></i>Логин</label>
            <input type="text" id="username" name="username" placeholder="Придумайте логин" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label for="password"><i data-lucide="lock-keyhole" aria-hidden="true"></i>Пароль</label>
            <input type="password" id="password" name="password" placeholder="Придумайте пароль" autocomplete="new-password" required>
        </div>
        <div class="form-group">
            <label for="confirmPassword"><i data-lucide="lock-keyhole" aria-hidden="true"></i>Подтверждение пароля</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль" autocomplete="new-password" required>
            <div class="password-match" id="passwordMatch" role="status">Пароли совпадают</div>
        </div>
        <div class="error-message" id="errorMessage" role="alert"></div>
        <div class="auth-actions">
            <button type="submit" class="primary-btn">Создать аккаунт</button>
            <button type="button" class="secondary-btn" onclick="goToLogin()">Назад к авторизации</button>
        </div>
    </form>
</main>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
    if (window.lucide) lucide.createIcons();
    function goToLogin() {
        window.location.href = '/login';
    }


    document.getElementById('confirmPassword').addEventListener('input', function() {
        const password = document.getElementById('password').value;
        const confirmPassword = this.value;
        const passwordMatch = document.getElementById('passwordMatch');

        if (confirmPassword && password === confirmPassword) {
            passwordMatch.classList.add('show');
        } else {
            passwordMatch.classList.remove('show');
        }
    });

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorMessage = document.getElementById('errorMessage');


        if (password !== confirmPassword) {
            errorMessage.textContent = 'Пароли не совпадают';
            errorMessage.classList.add('show');
            return;
        }

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            if (response.ok) {
                const data = await response.json();
                // Сохраняем токен и ID пользователя
                if (data.token) {
                    localStorage.setItem('token', data.token);
                }
                if (data.userId) {
                    localStorage.setItem('userId', data.userId);
                }

                window.location.href = '/home';
            } else {
                const error = await response.json();
                errorMessage.textContent = error.message || 'Ошибка при регистрации';
                errorMessage.classList.add('show');
            }
        } catch (error) {
            errorMessage.textContent = 'Ошибка сети. Проверьте подключение.';
            errorMessage.classList.add('show');
            console.error('Error:', error);
        }
    });
</script>
</body>
</html>
