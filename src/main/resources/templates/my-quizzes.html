<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои квизы - QuizArena</title>
    <style>
        :root {
            --ink: #0c1026;
            --muted: #626498;
            --line: #e8e8f6;
            --brand: #2f16f4;
            --brand-soft: #efeaff;
            --page: #f8f8ff;
            --danger: #ff4d55;
            --danger-soft: #fff0f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: var(--ink);
            background: var(--page);
        }

        button,
        input,
        select {
            font: inherit;
        }

        .content {
            min-width: 0;
            padding: 0 0 42px;
        }

        .hero {
            position: relative;
            overflow: hidden;
            min-height: 405px;
            padding: 76px 52px 116px;
            background:
                linear-gradient(90deg, rgba(3, 6, 31, .96) 0%, rgba(8, 7, 48, .82) 45%, rgba(13, 7, 55, .5) 100%),
                url('/images/space.png');
            background-size: cover;
            background-position: center;
        }

        .hero h1 {
            position: relative;
            z-index: 2;
            max-width: 560px;
            color: #fff;
            font-size: clamp(38px, 4vw, 58px);
            line-height: 1.02;
            letter-spacing: 0;
        }

        .hero p {
            position: relative;
            z-index: 2;
            max-width: 560px;
            margin-top: 24px;
            color: #fff;
            font-size: 20px;
            line-height: 1.55;
        }

        .hero-planet {
            position: absolute;
            right: clamp(28px, 9vw, 160px);
            bottom: 70px;
            width: min(430px, 32vw);
            opacity: .95;
            filter: drop-shadow(0 24px 30px rgba(104, 52, 224, .42));
            pointer-events: none;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: calc(100% - 88px);
            margin: -40px auto 0;
            position: relative;
            z-index: 5;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 12px;
            width: min(560px, 100%);
            min-height: 58px;
            padding: 0 18px;
            border: 1px solid #e2e0f5;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 14px 28px rgba(27, 24, 83, .06);
        }

        .filter-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
        }

        .search-icon,
        .filter-icon,
        .sort-direction-icon {
            flex: 0 0 auto;
            width: 24px;
            height: 24px;
            color: var(--brand);
            stroke-width: 2.5;
        }

        .search-input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: 0;
            color: #26226f;
            background: transparent;
            font-size: 18px;
        }

        .search-input::placeholder {
            color: #8a8abc;
        }

        .filter-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 218px;
            min-height: 58px;
            padding: 0 16px;
            border: 1px solid #e2e0f5;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 14px 28px rgba(27, 24, 83, .06);
        }

        .filter-select {
            width: 100%;
            border: 0;
            outline: 0;
            color: #29246e;
            background: transparent;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
        }

        .sort-wrap {
            min-width: 260px;
        }

        .sort-direction-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            border: 1px solid #e2e0f5;
            border-radius: 8px;
            color: var(--brand);
            background: #fff;
            cursor: pointer;
            box-shadow: 0 14px 28px rgba(27, 24, 83, .06);
            transition: transform .18s ease, box-shadow .18s ease;
        }

        .sort-direction-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 32px rgba(47, 22, 244, .14);
        }

        .quiz-list {
            display: grid;
            gap: 10px;
            width: calc(100% - 88px);
            margin: 28px auto 0;
            list-style: none;
        }

        .quiz-item {
            display: grid;
            grid-template-columns: minmax(280px, 1fr) minmax(120px, .45fr) minmax(132px, .45fr) auto;
            align-items: center;
            gap: 24px;
            min-height: 122px;
            padding: 20px 28px 20px 20px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 16px 34px rgba(27, 24, 83, .06);
            transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
        }

        .quiz-item:hover {
            transform: translateY(-2px);
            border-color: #dcd5ff;
            box-shadow: 0 20px 38px rgba(27, 24, 83, .09);
        }

        .quiz-main {
            display: grid;
            grid-template-columns: 64px minmax(0, 1fr);
            align-items: center;
            gap: 20px;
            min-width: 0;
            cursor: pointer;
        }

        .quiz-thumb {
            display: grid;
            place-items: center;
            width: 64px;
            height: 64px;
            border-radius: 8px;
            color: var(--brand);
            background: var(--brand-soft);
        }

        .quiz-thumb-icon {
            width: 32px;
            height: 32px;
            stroke-width: 2.4;
        }

        .quiz-title {
            overflow: hidden;
            color: var(--ink);
            font-size: 22px;
            font-weight: 900;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .quiz-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 12px;
            color: #7476bd;
            font-size: 16px;
            font-weight: 700;
        }

        .quiz-stat,
        .side-stat {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .quiz-stat-icon,
        .side-stat-icon {
            width: 21px;
            height: 21px;
            color: #7476bd;
            stroke-width: 2.4;
        }

        .visibility-public .quiz-stat-icon {
            color: #4d46c8;
        }

        .visibility-private .quiz-stat-icon {
            color: #4d46c8;
        }

        .side-stat {
            color: #4a4d82;
            font-size: 16px;
            font-weight: 800;
            line-height: 1.35;
        }

        .side-stat strong {
            display: block;
            color: var(--ink);
            font-size: 17px;
        }

        .quiz-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
        }

        .quiz-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 52px;
            padding: 0 24px;
            border: 0;
            border-radius: 8px;
            font-weight: 900;
            text-decoration: none;
            cursor: pointer;
            transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
        }

        .quiz-btn:hover {
            transform: translateY(-2px);
        }

        .quiz-btn.edit {
            color: var(--brand);
            background: var(--brand-soft);
        }

        .quiz-btn.delete {
            color: var(--danger);
            background: var(--danger-soft);
        }

        .quiz-btn-icon {
            width: 21px;
            height: 21px;
            stroke-width: 2.5;
        }

        .empty-state {
            display: grid;
            justify-items: center;
            gap: 12px;
            margin-top: 28px;
            width: calc(100% - 88px);
            margin-left: auto;
            margin-right: auto;
            padding: 54px 24px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: #6a6c9f;
            background: #fff;
            text-align: center;
        }

        .empty-icon {
            width: 46px;
            height: 46px;
            color: var(--brand);
            stroke-width: 2.2;
        }

        .empty-state strong {
            color: var(--ink);
            font-size: 22px;
        }

        .pagination-wrap {
            display: grid;
            justify-items: center;
            gap: 8px;
            margin-top: 24px;
            width: calc(100% - 88px);
            margin-left: auto;
            margin-right: auto;
        }

        .pagination-summary {
            color: #4d4a91;
            font-size: 16px;
            font-weight: 800;
        }

        .pagination-summary strong {
            color: #17145b;
            font-weight: 900;
        }

        .pagination {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
        }

        .page-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 46px;
            min-height: 46px;
            padding: 0 16px;
            border: 0;
            border-radius: 8px;
            color: #29246e;
            background: #fff;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(27, 24, 83, .08);
            transition: color .18s ease, background-color .18s ease, opacity .18s ease;
        }

        .page-btn:hover,
        .page-btn.active {
            color: #fff;
            background: var(--brand);
        }

        .page-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .page-icon {
            width: 18px;
            height: 18px;
            stroke-width: 2.4;
        }

        .page-ellipsis {
            display: inline-flex;
            align-items: center;
            min-height: 46px;
            padding: 0 4px;
            color: #29246e;
            font-weight: 900;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(12, 16, 38, .45);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: min(480px, 100%);
            padding: 28px;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 24px 60px rgba(12, 16, 38, .24);
        }

        .modal-title {
            color: var(--ink);
            font-size: 24px;
            font-weight: 900;
        }

        .modal-message {
            margin-top: 14px;
            color: #4b4e82;
            font-size: 16px;
            line-height: 1.55;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-btn {
            min-height: 44px;
            padding: 0 18px;
            border: 0;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
        }

        .modal-btn-primary {
            color: #fff;
            background: var(--brand);
        }

        .modal-btn-secondary {
            color: #29246e;
            background: var(--brand-soft);
        }

        .modal-btn-danger {
            color: #fff;
            background: var(--danger);
        }

        @media (max-width: 1260px) {
            .quiz-item {
                grid-template-columns: minmax(280px, 1fr) minmax(120px, .4fr) auto;
            }

            .date-stat {
                display: none;
            }
        }

        @media (max-width: 1080px) {
            .content {
                padding: 0 0 40px;
            }

            .hero {
                padding: 56px 36px 102px;
            }

            .toolbar {
                align-items: stretch;
                flex-direction: column;
                width: calc(100% - 56px);
            }

            .filter-controls {
                width: 100%;
            }

            .filter-wrap {
                flex: 1;
                min-width: 0;
            }

            .quiz-list,
            .empty-state,
            .pagination-wrap {
                width: calc(100% - 56px);
            }

            .search-box,
            .filter-wrap {
                width: 100%;
            }

            .quiz-item {
                grid-template-columns: 1fr;
                align-items: stretch;
                gap: 18px;
            }

            .quiz-actions {
                justify-content: stretch;
            }

            .quiz-btn {
                flex: 1;
            }
        }

        @media (max-width: 720px) {
            .content {
                padding: 0 0 32px;
            }

            .hero {
                min-height: 300px;
                padding: 42px 24px 86px;
            }

            .hero-planet {
                right: -70px;
                bottom: 32px;
                width: 260px;
                opacity: .4;
            }

            .toolbar,
            .quiz-list,
            .empty-state,
            .pagination-wrap {
                width: calc(100% - 32px);
            }

            .quiz-main {
                grid-template-columns: 54px minmax(0, 1fr);
                gap: 14px;
            }

            .quiz-thumb {
                width: 54px;
                height: 54px;
            }

            .quiz-title {
                font-size: 19px;
            }

            .quiz-meta {
                gap: 10px;
                font-size: 14px;
            }

            .quiz-actions,
            .modal-buttons {
                flex-direction: column;
            }

            .page-btn span {
                display: none;
            }
        }
    </style>
    <link rel="stylesheet" href="/css/sidebar.css">
</head>
<body>
<div class="page">
    <aside th:replace="~{fragments/sidebar :: sidebar('my-quizzes')}"></aside>

    <main class="content">
        <section class="hero">
            <h1>Мои квизы</h1>
            <p>Здесь собраны все ваши квизы. Редактируйте, удаляйте или делитесь ими.</p>
            <img class="hero-planet" src="/images/planet.png" alt="">
        </section>

        <section class="toolbar" aria-label="Фильтры моих квизов">
            <label class="search-box" for="searchInput">
                <i class="search-icon" data-lucide="search" aria-hidden="true"></i>
                <input class="search-input" id="searchInput" type="text" placeholder="Поиск квизов..." th:value="${search}">
            </label>
            <div class="filter-controls">
                <label class="filter-wrap" for="visibilitySelect">
                    <i class="filter-icon" data-lucide="list-filter" aria-hidden="true"></i>
                    <select class="filter-select" id="visibilitySelect" onchange="applyFilters(0)">
                        <option value="all" th:selected="${visibility == 'all'}">Все квизы</option>
                        <option value="public" th:selected="${visibility == 'public'}">Публичные</option>
                        <option value="private" th:selected="${visibility == 'private'}">Приватные</option>
                    </select>
                </label>
                <label class="filter-wrap sort-wrap" for="sortSelect">
                    <i class="filter-icon" data-lucide="list-filter" aria-hidden="true"></i>
                    <select class="filter-select" id="sortSelect" onchange="applyFilters(0)">
                        <option value="created" th:selected="${sort == 'created'}">Дата создания</option>
                        <option value="questions" th:selected="${sort == 'questions'}">Кол-во вопросов</option>
                        <option value="attempts" th:selected="${sort == 'attempts'}">Кол-во прохождений</option>
                    </select>
                </label>
                <button class="sort-direction-btn" type="button" onclick="toggleSortDirection()" aria-label="Сменить порядок сортировки">
                    <i class="sort-direction-icon"
                       th:attr="data-lucide=${direction == 'asc' ? 'arrow-up-wide-narrow' : 'arrow-down-wide-narrow'}"
                       aria-hidden="true"></i>
                </button>
            </div>
        </section>

        <ul class="quiz-list" th:if="${createdQuizzes != null and !createdQuizzes.isEmpty()}">
            <li class="quiz-item" th:each="quiz : ${createdQuizzes}">
                <div class="quiz-main" th:onclick="'goToQuiz(' + ${quiz.id} + ')'">
                    <span class="quiz-thumb">
                        <i class="quiz-thumb-icon" data-lucide="file-text" aria-hidden="true"></i>
                    </span>
                    <div class="quiz-copy">
                        <div class="quiz-title" th:text="${quiz.name}">Название квиза</div>
                        <div class="quiz-meta">
                            <span class="quiz-stat">
                                <i class="quiz-stat-icon" data-lucide="circle-help" aria-hidden="true"></i>
                                <span th:text="${quiz.questionCount} + ' вопроса'">3 вопроса</span>
                            </span>
                            <span class="quiz-stat">
                                <i class="quiz-stat-icon" data-lucide="clock" aria-hidden="true"></i>
                                <span th:text="${quiz.timeLimit != null and quiz.timeLimit > 0 ? (quiz.timeLimit < 60 ? quiz.timeLimit + ' сек' : T(java.lang.Math).ceil(quiz.timeLimit / 60.0).intValue() + ' мин') : 'Без лимита'}">2 мин</span>
                            </span>
                            <span class="quiz-stat"
                                  th:classappend="${quiz.isPublic} ? ' visibility-public' : ' visibility-private'">
                                <i class="quiz-stat-icon"
                                   th:attr="data-lucide=${quiz.isPublic ? 'globe' : 'lock'}"
                                   aria-hidden="true"></i>
                                <span th:text="${quiz.isPublic ? 'Публичный' : 'Приватный'}">Публичный</span>
                            </span>
                        </div>
                    </div>
                </div>

                <div class="side-stat">
                    <i class="side-stat-icon" data-lucide="users" aria-hidden="true"></i>
                    <span>
                        <strong th:text="${completedAttemptCounts != null and completedAttemptCounts[quiz.id] != null ? completedAttemptCounts[quiz.id] : 0}">125</strong>
                        <span>прохождений</span>
                    </span>
                </div>

                <div class="side-stat date-stat">
                    <i class="side-stat-icon" data-lucide="calendar-days" aria-hidden="true"></i>
                    <span>
                        <strong th:text="${quiz.createdAt != null ? #temporals.format(quiz.createdAt, 'dd.MM.yyyy') : '-'}">06.04.2026</strong>
                        <span>создан</span>
                    </span>
                </div>

                <div class="quiz-actions" onclick="event.stopPropagation()">
                    <button class="quiz-btn edit" type="button" th:onclick="'editQuiz(' + ${quiz.id} + ')'">
                        <i class="quiz-btn-icon" data-lucide="pencil" aria-hidden="true"></i>
                        <span>Редактировать</span>
                    </button>
                    <button class="quiz-btn delete" type="button" th:onclick="'deleteQuiz(' + ${quiz.id} + ')'">
                        <i class="quiz-btn-icon" data-lucide="trash-2" aria-hidden="true"></i>
                        <span>Удалить</span>
                    </button>
                </div>
            </li>
        </ul>

        <div class="empty-state" th:if="${createdQuizzes == null or createdQuizzes.isEmpty()}">
            <i class="empty-icon" data-lucide="search-x" aria-hidden="true"></i>
            <strong>Квизы не найдены</strong>
            <span>Создайте первый квиз или измените параметры поиска.</span>
        </div>

        <div class="pagination-wrap" th:if="${totalElements != null and totalElements > 0}">
            <div class="pagination-summary">
                Показано
                <strong th:text="${shownFrom}">1</strong><span>-</span><strong th:text="${shownTo}">5</strong>
                из <strong th:text="${totalElements}">10</strong> квизов
            </div>
            <div class="pagination" th:if="${totalPages > 1}">
                <button class="page-btn" type="button" th:disabled="${currentPage <= 0}" th:onclick="'goToPage(' + ${currentPage - 1} + ')'">
                    <i class="page-icon" data-lucide="arrow-left" aria-hidden="true"></i>
                    <span>Назад</span>
                </button>
                <button class="page-btn" type="button"
                        th:classappend="${currentPage == 0 ? 'active' : ''}"
                        th:onclick="'goToPage(0)'">1</button>
                <button class="page-btn" type="button"
                        th:if="${totalPages >= 2}"
                        th:classappend="${currentPage == 1 ? 'active' : ''}"
                        th:onclick="'goToPage(1)'">2</button>
                <button class="page-btn" type="button"
                        th:if="${totalPages >= 3}"
                        th:classappend="${currentPage == 2 ? 'active' : ''}"
                        th:onclick="'goToPage(2)'">3</button>
                <span class="page-ellipsis" th:if="${totalPages > 4}">...</span>
                <button class="page-btn" type="button"
                        th:if="${totalPages > 3}"
                        th:classappend="${currentPage == totalPages - 1 ? 'active' : ''}"
                        th:onclick="'goToPage(' + ${totalPages - 1} + ')'"
                        th:text="${totalPages}">8</button>
                <button class="page-btn" type="button" th:disabled="${currentPage >= totalPages - 1}" th:onclick="'goToPage(' + ${currentPage + 1} + ')'">
                    <span>Вперёд</span>
                    <i class="page-icon" data-lucide="arrow-right" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </main>
</div>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal">
        <div class="modal-title" id="modalTitle">Подтверждение</div>
        <div class="modal-message" id="modalMessage"></div>
        <div class="modal-buttons" id="modalButtons"></div>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script th:inline="javascript">
    const currentUserId = /*[[${userId}]]*/ null;

    if (window.lucide) {
        lucide.createIcons();
    }

    document.getElementById('searchInput')?.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
            applyFilters(0);
        }
    });

    function goToQuiz(quizId) {
        window.location.href = '/quiz/' + quizId;
    }

    function editQuiz(quizId) {
        window.location.href = '/quiz/' + quizId + '/edit';
    }

    function goToPage(page) {
        applyFilters(page);
    }

    function toggleSortDirection() {
        const currentDirection = new URLSearchParams(window.location.search).get('direction') || 'desc';
        applyFilters(0, currentDirection === 'asc' ? 'desc' : 'asc');
    }

    function applyFilters(page, directionOverride) {
        const params = new URLSearchParams();
        const search = document.getElementById('searchInput')?.value.trim();
        const visibility = document.getElementById('visibilitySelect')?.value || 'all';
        const sort = document.getElementById('sortSelect')?.value || 'created';
        const direction = directionOverride || new URLSearchParams(window.location.search).get('direction') || 'desc';
        if (search) {
            params.set('search', search);
        }
        if (visibility !== 'all') {
            params.set('visibility', visibility);
        }
        if (sort !== 'created') {
            params.set('sort', sort);
        }
        if (direction !== 'desc') {
            params.set('direction', direction);
        }
        if (page > 0) {
            params.set('page', page);
        }
        const query = params.toString();
        window.location.href = '/my-quizzes' + (query ? '?' + query : '');
    }

    function showModal(title, message, buttons) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalMessage').textContent = message;
        const buttonsContainer = document.getElementById('modalButtons');
        buttonsContainer.innerHTML = '';

        buttons.forEach((btn) => {
            const button = document.createElement('button');
            button.className = 'modal-btn ' + btn.className;
            button.textContent = btn.text;
            button.onclick = btn.onclick;
            buttonsContainer.appendChild(button);
        });

        document.getElementById('modalOverlay').classList.add('show');
    }

    function hideModal() {
        document.getElementById('modalOverlay').classList.remove('show');
    }

    document.getElementById('modalOverlay')?.addEventListener('click', function (event) {
        if (event.target === this) {
            hideModal();
        }
    });

    function deleteQuiz(quizId) {
        showModal(
            'Удалить квиз?',
            'Квиз и связанные с ним данные будут удалены. Это действие нельзя отменить.',
            [
                { text: 'Отмена', className: 'modal-btn-secondary', onclick: hideModal },
                {
                    text: 'Удалить',
                    className: 'modal-btn-danger',
                    onclick: async () => {
                        hideModal();
                        await performDelete(quizId);
                    }
                }
            ]
        );
    }

    function getAuthToken() {
        const localToken = localStorage.getItem('token');
        if (localToken) {
            return localToken;
        }
        const match = document.cookie.match(/(?:^|;\s*)authToken=([^;]+)/);
        return match ? decodeURIComponent(match[1]) : null;
    }

    async function performDelete(quizId) {
        if (!currentUserId) {
            showModal('Ошибка', 'Пользователь не найден.', [
                { text: 'OK', className: 'modal-btn-primary', onclick: hideModal }
            ]);
            return;
        }

        try {
            const token = getAuthToken();
            const headers = { 'Content-Type': 'application/json' };
            if (token) {
                headers.Authorization = 'Bearer ' + token;
            }

            const response = await fetch('/api/quizzes/' + quizId + '?userId=' + currentUserId, {
                method: 'DELETE',
                headers
            });

            if (response.ok) {
                window.location.reload();
                return;
            }

            const errorText = await response.text();
            showModal('Ошибка', errorText || 'Не удалось удалить квиз.', [
                { text: 'OK', className: 'modal-btn-primary', onclick: hideModal }
            ]);
        } catch (error) {
            showModal('Ошибка сети', 'Проверьте подключение и попробуйте снова.', [
                { text: 'OK', className: 'modal-btn-primary', onclick: hideModal }
            ]);
        }
    }
</script>
</body>
</html>
