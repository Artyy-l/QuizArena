<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная - QuizArena</title>
    <style>
        :root {
            --ink: #0c1026;
            --muted: #585a8a;
            --line: #e8e8f6;
            --brand: #2f16f4;
            --brand-soft: #efeaff;
            --page: #f8f8ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: var(--ink);
            background: var(--page);
        }


        .search-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 48px;
            border: 0;
            border-radius: 8px;
            color: #fff;
            background: var(--brand);
            font: inherit;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 14px 30px rgba(47, 22, 244, .22);
            transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            background: #2410d8;
            box-shadow: 0 18px 34px rgba(47, 22, 244, .3);
        }

        .content {
            min-width: 0;
            padding-bottom: 42px;
        }

        .hero {
            position: relative;
            z-index: 0;
            min-height: 405px;
            overflow: hidden;
            color: #fff;
            background-image: linear-gradient(90deg, rgba(3, 6, 31, .96) 0%, rgba(8, 7, 48, .82) 45%, rgba(13, 7, 55, .45) 100%), url('/images/space.png');
            background-size: cover;
            background-position: center;
            padding: 44px 52px 112px;
        }

        .eyebrow,
        .hero h1,
        .hero p {
            position: relative;
            z-index: 6;
            max-width: 700px;
        }

        .eyebrow {
            color: #bba8ff;
            font-size: 16px;
            font-weight: 800;
        }

        .hero h1 {
            margin-top: 20px;
            font-size: clamp(34px, 4.4vw, 58px);
            line-height: 1.05;
        }

        .hero h1 span {
            color: #8d63ff;
        }

        .hero p {
            margin-top: 18px;
            font-size: 18px;
            line-height: 1.55;
        }

        .hero-visual {
            position: absolute;
            right: clamp(0px, 4vw, 58px);
            bottom: -74px;
            width: min(720px, 54vw);
            height: min(500px, 38vw);
            pointer-events: none;
        }

        .hero-side-planet {
            position: absolute;
            z-index: 1;
            right: clamp(470px, 35vw, 640px);
            bottom: 162px;
            width: min(280px, 19vw);
            opacity: .82;
            filter: drop-shadow(0 16px 24px rgba(117, 35, 224, .36));
            pointer-events: none;
        }

        .hero-visual::after {
            content: "";
            position: absolute;
            z-index: 3;
            left: 50%;
            bottom: 35%;
            width: 26%;
            height: 5%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, .78) 0%, rgba(18, 0, 46, .5) 44%, rgba(98, 30, 190, .14) 70%, rgba(98, 30, 190, 0) 100%);
            transform: translateX(-50%);
            filter: blur(6px);
            opacity: .78;
        }

        .hero-planet {
            position: absolute;
            z-index: 1;
            left: 50%;
            bottom: 0;
            width: 126%;
            transform: translateX(-50%);
            filter: saturate(1.2) contrast(1.08) drop-shadow(0 20px 30px rgba(84, 26, 224, .42));
        }

        .hero-trophy {
            position: absolute;
            z-index: 4;
            left: 50%;
            bottom: 34%;
            width: 48%;
            transform: translateX(-50%);
            filter: drop-shadow(0 24px 28px rgba(84, 26, 224, .58));
        }

        .search-panel {
            position: relative;
            z-index: 8;
            width: calc(100% - 104px);
            margin: -62px auto 26px;
            padding: 16px;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 18px 36px rgba(27, 24, 83, .12);
        }

        .search-box {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
        }

        .search-input-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 52px;
            padding: 0 16px;
            border: 1px solid #e2e0f5;
            border-radius: 8px;
            background: #f4f2ff;
        }

        .search-icon {
            width: 22px;
            height: 22px;
            color: var(--brand);
            stroke-width: 2.4;
        }

        .search-input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: 0;
            color: #26226f;
            background: transparent;
            font: inherit;
            font-size: 16px;
        }

        .search-input::placeholder {
            color: #68669a;
        }

        .search-btn {
            min-width: 126px;
            min-height: 52px;
        }

        .main {
            width: calc(100% - 104px);
            margin: 0 auto;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 26px;
            font-weight: 900;
        }

        .sort-form {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 38px;
        }

        .sort-select-wrap,
        .sort-direction-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            border: 1px solid #d9d6f5;
            border-radius: 8px;
            color: #29246e;
            background: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 800;
            box-shadow: 0 8px 18px rgba(27, 24, 83, .05);
        }

        .sort-select-wrap {
            gap: 8px;
            padding: 0 10px;
        }

        .sort-select {
            border: 0;
            outline: 0;
            color: inherit;
            background: transparent;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        .sort-direction-btn {
            width: 44px;
            cursor: pointer;
            transition: color .18s ease, background-color .18s ease, box-shadow .18s ease;
        }

        .sort-direction-btn:hover {
            color: var(--brand);
            background: var(--brand-soft);
            box-shadow: inset 0 0 0 1px #dfd7ff;
        }

        .sort-icon {
            width: 18px;
            height: 18px;
            color: var(--brand);
            stroke-width: 2.4;
        }

        .quiz-list {
            display: grid;
            gap: 12px;
            list-style: none;
        }

        .quiz-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 24px;
            min-height: 92px;
            padding: 18px 24px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 12px 28px rgba(27, 24, 83, .08);
            cursor: pointer;
            transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
        }

        .quiz-item:hover {
            transform: translateY(-2px);
            border-color: #cabfff;
            box-shadow: 0 18px 34px rgba(27, 24, 83, .12);
        }

        .quiz-main {
            min-width: 0;
        }

        .quiz-name {
            overflow: hidden;
            color: #15153a;
            font-size: 20px;
            font-weight: 900;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .quiz-author {
            margin-top: 8px;
            color: var(--muted);
            font-size: 14px;
        }

        .quiz-stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 22px;
            color: #24235f;
            font-weight: 800;
        }

        .quiz-stat {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .quiz-stat-icon {
            width: 18px;
            height: 18px;
            color: var(--brand);
            stroke-width: 2.35;
        }

        .empty-state {
            display: grid;
            justify-items: center;
            gap: 10px;
            padding: 46px 24px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--muted);
            background: #fff;
            text-align: center;
            box-shadow: 0 12px 28px rgba(27, 24, 83, .08);
        }

        .empty-icon {
            width: 38px;
            height: 38px;
            color: var(--brand);
            stroke-width: 2.2;
        }

        .pagination {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
        }

        .page-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 46px;
            min-height: 46px;
            padding: 0 16px;
            border: 0;
            border-radius: 8px;
            color: #29246e;
            background: #fff;
            font: inherit;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(27, 24, 83, .08);
            transition: color .18s ease, background-color .18s ease, opacity .18s ease;
        }

        .page-btn:hover,
        .page-btn.active {
            color: #fff;
            border-color: var(--brand);
            background: var(--brand);
        }

        .page-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .page-icon {
            width: 18px;
            height: 18px;
            stroke-width: 2.4;
        }

        .pagination-wrap {
            display: grid;
            justify-items: center;
            gap: 8px;
            margin-top: 24px;
        }

        .pagination-summary {
            color: #4d4a91;
            font-size: 16px;
            font-weight: 800;
        }

        .pagination-summary strong {
            color: #17145b;
            font-weight: 900;
        }

        .page-ellipsis {
            display: inline-flex;
            align-items: center;
            min-height: 46px;
            padding: 0 4px;
            color: #29246e;
            font-weight: 900;
        }

        @media (max-width: 1080px) {


        }

        @media (max-width: 820px) {


            .hero {
                min-height: 360px;
                padding: 36px 22px 98px;
            }

            .hero-visual {
                right: -80px;
                bottom: -48px;
                width: 460px;
                height: 310px;
                opacity: .82;
            }

            .hero-side-planet {
                right: 230px;
                bottom: 160px;
                width: 128px;
            }

            .search-panel,
            .main {
                width: calc(100% - 32px);
            }

            .search-box,
            .quiz-item {
                grid-template-columns: 1fr;
            }

            .quiz-stats {
                justify-content: flex-start;
                gap: 14px;
            }

            .section-head {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="/css/sidebar.css">
</head>
<body>
<div class="page">
    <aside th:replace="~{fragments/sidebar :: sidebar('home')}"></aside>

    <main class="content">
        <section class="hero">
            <div class="eyebrow">Добро пожаловать в QuizArena</div>
            <h1>Создавай и проходи квизы <span>с ИИ</span></h1>
            <p>Генерация по теме или материалам за пару минут!</p>
            <img class="hero-side-planet" src="/images/planet.png" alt="">
            <div class="hero-visual" aria-hidden="true">
                <img class="hero-planet" src="/images/planet_under_trophy.png" alt="">
                <img class="hero-trophy" src="/images/trophey.png" alt="">
            </div>
        </section>

        <section class="search-panel" aria-label="Поиск квизов">
            <div class="search-box">
                <label class="search-input-wrap" for="searchInput">
                    <i class="search-icon" data-lucide="search" aria-hidden="true"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="Поиск квизов по названию..." th:value="${search}">
                </label>
                <button class="search-btn" type="button" onclick="performSearch()">
                    <i data-lucide="arrow-right" aria-hidden="true"></i>
                    <span>Найти</span>
                </button>
            </div>
        </section>

        <section class="main">
            <div class="section-head">
                <h2 class="section-title">Все квизы</h2>
                <form class="sort-form" id="sortForm" action="/home" method="get">
                    <input type="hidden" name="search" th:value="${search}">
                    <input type="hidden" name="direction" id="sortDirectionInput" th:value="${direction}">
                    <label class="sort-select-wrap" for="sortSelect">
                        <i class="sort-icon" data-lucide="list-filter" aria-hidden="true"></i>
                        <select class="sort-select" id="sortSelect" name="sort" onchange="submitSortForm()">
                            <option value="created" th:selected="${sort == 'created'}">Дата создания</option>
                            <option value="questions" th:selected="${sort == 'questions'}">Кол-во вопросов</option>
                            <option value="attempts" th:selected="${sort == 'attempts'}">Кол-во прохождений</option>
                        </select>
                    </label>
                    <button class="sort-direction-btn" type="button" onclick="toggleSortDirection()" aria-label="Сменить порядок сортировки">
                        <i class="sort-icon"
                           th:attr="data-lucide=${direction == 'asc' ? 'arrow-up-wide-narrow' : 'arrow-down-wide-narrow'}"
                           aria-hidden="true"></i>
                    </button>
                </form>
            </div>

            <ul class="quiz-list" th:if="${quizzes != null and !quizzes.isEmpty()}">
                <li class="quiz-item" th:each="quiz : ${quizzes}" th:onclick="'goToQuiz(' + ${quiz.id} + ')'">
                    <div class="quiz-main">
                        <div class="quiz-name" th:text="${quiz.name}">Название квиза</div>
                        <div class="quiz-author" th:text="'Автор: ' + ${quiz.author}">Автор: пользователь</div>
                    </div>
                    <div class="quiz-stats">
                        <span class="quiz-stat">
                            <i class="quiz-stat-icon" data-lucide="circle-help" aria-hidden="true"></i>
                            <span th:text="${quiz.questionCount} + ' вопросов'">15 вопросов</span>
                        </span>
                        <span class="quiz-stat">
                            <i class="quiz-stat-icon" data-lucide="clock" aria-hidden="true"></i>
                            <span th:text="${quiz.timeLimit != null and quiz.timeLimit > 0 ? T(java.lang.Math).ceil(quiz.timeLimit / 60.0).intValue() + ' мин' : 'Без лимита'}">10 мин</span>
                        </span>
                        <span class="quiz-stat">
                            <i class="quiz-stat-icon" data-lucide="users" aria-hidden="true"></i>
                            <span th:text="${completedAttemptCounts != null and completedAttemptCounts[quiz.id] != null ? completedAttemptCounts[quiz.id] : 0} + ' прохождений'">0 прохождений</span>
                        </span>
                    </div>
                </li>
            </ul>

            <div class="empty-state" th:if="${quizzes == null or quizzes.isEmpty()}">
                <i class="empty-icon" data-lucide="search-x" aria-hidden="true"></i>
                <strong>Квизы не найдены</strong>
                <span>Попробуйте изменить запрос в поиске.</span>
            </div>

            <div class="pagination-wrap" th:if="${totalElements != null and totalElements > 0}">
                <div class="pagination-summary">
                    Показано
                    <strong th:text="${shownFrom}">1</strong><span>-</span><strong th:text="${shownTo}">5</strong>
                    из <strong th:text="${totalElements}">38</strong> квизов
                </div>
                <div class="pagination" th:if="${totalPages > 1}">
                    <button class="page-btn" type="button" th:disabled="${currentPage <= 0}" th:onclick="'goToPage(' + ${currentPage - 1} + ')'">
                        <i class="page-icon" data-lucide="arrow-left" aria-hidden="true"></i>
                        <span>Назад</span>
                    </button>
                    <button class="page-btn" type="button"
                            th:classappend="${currentPage == 0 ? 'active' : ''}"
                            th:onclick="'goToPage(0)'">1</button>
                    <button class="page-btn" type="button"
                            th:if="${totalPages >= 2}"
                            th:classappend="${currentPage == 1 ? 'active' : ''}"
                            th:onclick="'goToPage(1)'">2</button>
                    <button class="page-btn" type="button"
                            th:if="${totalPages >= 3}"
                            th:classappend="${currentPage == 2 ? 'active' : ''}"
                            th:onclick="'goToPage(2)'">3</button>
                    <span class="page-ellipsis" th:if="${totalPages > 4}">...</span>
                    <button class="page-btn" type="button"
                            th:if="${totalPages > 3}"
                            th:classappend="${currentPage == totalPages - 1 ? 'active' : ''}"
                            th:onclick="'goToPage(' + ${totalPages - 1} + ')'"
                            th:text="${totalPages}">8</button>
                    <button class="page-btn" type="button" th:disabled="${currentPage >= totalPages - 1}" th:onclick="'goToPage(' + ${currentPage + 1} + ')'">
                        <span>Вперёд</span>
                        <i class="page-icon" data-lucide="arrow-right" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
    if (window.lucide) {
        lucide.createIcons();
    }

    function goToQuiz(quizId) {
        window.location.href = '/quiz/' + quizId;
    }

    function performSearch() {
        const searchTerm = document.getElementById('searchInput').value.trim();
        window.location.href = buildHomeUrl(0, searchTerm);
    }

    function goToPage(page) {
        const searchTerm = document.getElementById('searchInput').value.trim();
        window.location.href = buildHomeUrl(page, searchTerm);
    }

    function currentSortParams() {
        return {
            sort: document.getElementById('sortSelect')?.value || 'created',
            direction: document.getElementById('sortDirectionInput')?.value || 'desc'
        };
    }

    function buildHomeUrl(page, searchTerm) {
        const params = new URLSearchParams();
        params.set('search', searchTerm);
        params.set('page', page);
        const sortParams = currentSortParams();
        params.set('sort', sortParams.sort);
        params.set('direction', sortParams.direction);
        return '/home?' + params.toString();
    }

    function submitSortForm() {
        document.getElementById('sortForm').submit();
    }

    function toggleSortDirection() {
        const directionInput = document.getElementById('sortDirectionInput');
        directionInput.value = directionInput.value === 'asc' ? 'desc' : 'asc';
        submitSortForm();
    }

    document.getElementById('searchInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            performSearch();
        }
    });
</script>
</body>
</html>
